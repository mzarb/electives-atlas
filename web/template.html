<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electives Atlas</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#162338;background:#f6f8fc}*{box-sizing:border-box}body{margin:0}.shell{max-width:1360px;margin:auto;padding:30px 28px 90px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:#547399;font-size:11px;font-weight:800}h1{font-size:32px;letter-spacing:-1.2px;margin:6px 0 4px}header p{color:#68778a;margin:0}.tag{background:#e8edf7;color:#526880;font-size:12px;border-radius:50px;padding:9px 13px}.tabs{display:flex;gap:7px;background:#e9eef5;padding:5px;width:max-content;max-width:100%;border-radius:12px;margin-bottom:20px}.tabs button,.stage button{border:0;cursor:pointer;font:inherit}.tabs button{padding:11px 18px;background:transparent;color:#64748b;border-radius:9px;font-weight:650}.tabs button.active{background:white;color:#14283e;box-shadow:0 2px 6px #17223a12}.panel{background:white;border:1px solid #e3e9f0;border-radius:17px;padding:22px;margin-bottom:18px}.filters{display:grid;grid-template-columns:minmax(260px,2fr) minmax(190px,1.2fr) minmax(180px,1fr);gap:14px;align-items:end}.field label{display:block;font-size:12px;color:#586a80;font-weight:750;margin-bottom:8px}.field select,.field input{width:100%;border:1px solid #d9e2ec;border-radius:10px;padding:12px;background:white;font:inherit;color:#1b3048}.stage{display:flex;gap:7px;flex-wrap:wrap}.stage button{padding:11px 17px;border:1px solid #d9e2ec;border-radius:10px;background:#fff;color:#51637c}.stage button.active{background:#173959;color:white;border-color:#173959}.summary{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:22px 0 15px}.summary h2{font-size:22px;margin:0 0 5px;letter-spacing:-.5px}.muted{font-size:13px;color:#718095}.metrics{display:flex;gap:8px;flex-wrap:wrap}.metric{background:#eaf1f9;border-radius:8px;padding:8px 12px;font-size:12px;color:#375675;font-weight:650}.semester-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.semester{background:#eff3f8;border:1px solid #e4eaf3;border-radius:15px;padding:16px;min-height:220px}.semester h3{font-size:15px;margin:0 0 14px}.group{background:white;border:1px solid #dfe7ef;border-radius:12px;padding:15px;margin-bottom:12px}.grouphead{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #ecf0f4;padding-bottom:12px;margin-bottom:8px}.grouphead strong{font-size:13px}.pill{font-size:11px;color:#54718e;background:#eff5fa;border-radius:7px;padding:5px 8px;white-space:nowrap}.module{display:flex;gap:12px;align-items:baseline;padding:10px 1px;border-bottom:1px solid #f0f3f6;font-size:13px}.module:last-child{border:0}.code{font-size:11px;font-weight:800;white-space:nowrap;color:#3d6490;background:#eff5fb;padding:5px 7px;border-radius:5px}.module-name{flex:1}.empty{color:#8190a2;font-size:13px;padding:15px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.action{border:1px solid #ccd8e5;background:white;padding:10px 13px;border-radius:9px;cursor:pointer;color:#214464;font-weight:700;font-size:12px}.action.primary{background:#173959;color:white;border-color:#173959}.list-table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;color:#64768a;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #dfe7f0;padding:13px 12px}td{padding:12px;border-bottom:1px solid #eef2f7;vertical-align:top}tr:last-child td{border:0}.right{text-align:right}.table-wrap{overflow:auto}footer{color:#8290a1;font-size:12px;margin-top:35px;line-height:1.6}@media(max-width:800px){.filters{grid-template-columns:1fr}.semester-grid{grid-template-columns:1fr}.shell{padding:18px 14px}header{align-items:start}h1{font-size:26px}.tag{display:none}.summary{align-items:start;flex-direction:column}}
</style></head><body><main class="shell"><header><div><div class="eyebrow">Curriculum explorer</div><h1>Electives Atlas</h1><p>Explore elective choices across courses, stages and semesters.</p></div><div class="tag" id="dataset"></div></header>
<nav class="tabs"><button class="active" data-view="course">Browse by course</button><button data-view="stage">All electives by stage</button></nav>
<section class="panel"><div class="filters"><div class="field" id="courseField"><label for="course">Course</label><select id="course"></select></div><div class="field"><label>Stage</label><div class="stage" id="stages"></div></div><div class="field"><label for="search">Search modules</label><input id="search" placeholder="Title or module code…"></div></div></section>
<div class="summary"><div><h2 id="heading"></h2><div class="muted" id="subtitle"></div></div><div class="toolbar"><span class="metrics" id="metrics"></span><button class="action" id="copy">Copy list</button><button class="action primary" id="csv">Export CSV</button></div></div><div id="content"></div>
<footer>Source: 84 elective-group PDFs supplied in the latest complete archive. </footer></main>
<script>const data=__ELECTIVES_DATA__;
const excludedPlacementCodes=new Set(['CE2020','CE2021','CE2022']);
data.forEach(g=>{g.rows=g.rows.filter(r=>!excludedPlacementCodes.has(String(r.code).toUpperCase()))});
const courses=[...new Map(data.map(g=>[g.courseCode,{code:g.courseCode,name:g.course}])).values()].sort((a,b)=>a.name.localeCompare(b.name));
let view='course', course=courses[0].code, stage='all',search='';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('dataset').textContent=`${courses.length} courses · ${data.length} elective groups`;
$('course').innerHTML=courses.map(c=>`<option value="${esc(c.code)}">${esc(c.name)}</option>`).join('');$('course').value=course;
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;stage='all';render()}));
$('course').onchange=e=>{course=e.target.value;stage='all';render()};$('search').oninput=e=>{search=e.target.value.trim().toLowerCase();render()};
function selectedGroups(){return data.filter(g=>view==='stage'||g.courseCode===course)}
function availableStages(){return [...new Set(selectedGroups().flatMap(g=>g.rows.map(r=>r.stage)))].sort((a,b)=>a-b)}
function filteredRows(){return selectedGroups().flatMap(g=>g.rows.filter(r=>(stage==='all'||r.stage===Number(stage))&&(!search||(r.code+' '+r.title).toLowerCase().includes(search))).map(r=>({...r,course:g.course,courseCode:g.courseCode,group:g.group})))}
function unique(rows){const m=new Map();rows.forEach(r=>{const k=r.stage+'|'+r.semester+'|'+r.code;if(!m.has(k))m.set(k,{...r,courses:new Set(),semesters:new Set(),groups:new Set()});let v=m.get(k);v.courses.add(r.courseCode);v.semesters.add(r.semester);v.groups.add(r.courseCode+'-'+r.group)});return [...m.values()].sort((a,b)=>a.stage-b.stage||a.semester-b.semester||a.title.localeCompare(b.title))}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function exportRows(){let r=filteredRows();return view==='stage'?unique(r).map(x=>({Stage:x.stage,Semester:x.semester,Code:x.code,Module:x.title,Courses:x.courses.size})):r.map(x=>({Course:x.course,Stage:x.stage,Semester:x.semester,Group:x.group,Code:x.code,Module:x.title}))}
$('csv').onclick=()=>{let rows=exportRows();if(!rows.length)return;let cols=Object.keys(rows[0]),txt=[cols.map(csvCell).join(','),...rows.map(r=>cols.map(c=>csvCell(r[c])).join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'}));a.download='electives-atlas-'+view+(stage==='all'?'':'-stage-'+stage)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
$('copy').onclick=async()=>{let r=exportRows();let txt=r.map(o=>Object.values(o).join(' | ')).join('\n');try{await navigator.clipboard.writeText(txt);$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy list',1300)}catch{alert('Copy is blocked by this browser; use Export CSV instead.')}};
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('courseField').style.display=view==='course'?'block':'none';$('courseField').parentElement.style.gridTemplateColumns=view==='course'?'':'minmax(180px,1fr) minmax(220px,2fr)';let avail=availableStages();if(stage!=='all'&&!avail.includes(Number(stage)))stage='all';$('stages').innerHTML=[`<button data-stage="all" class="${stage==='all'?'active':''}">All</button>`,...avail.map(s=>`<button data-stage="${s}" class="${String(stage)===String(s)?'active':''}">Stage ${s}</button>`)].join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;render()});let rows=filteredRows(),uni=unique(rows),groups=selectedGroups().filter(g=>g.rows.some(r=>rows.some(x=>x.courseCode===g.courseCode&&x.group===g.group&&x.stage===r.stage&&x.code===r.code)));$('heading').textContent=view==='stage'?'All electives by stage':courses.find(c=>c.code===course)?.name||'';$('subtitle').textContent=view==='stage'?'Deduplicated within each stage and semester, across all courses · placement modules excluded':`Elective groups are kept separate to preserve choice structures${stage==='all'?'':' · Stage '+stage}`;$('metrics').innerHTML=`<span class="metric">${uni.length} unique modules</span><span class="metric">${view==='course'?groups.length+' groups':new Set(rows.map(x=>x.courseCode)).size+' courses'}</span>`;
if(view==='stage'){let stages=stage==='all'?[...new Set(uni.map(x=>x.stage))]:[Number(stage)];$('content').innerHTML=stages.map(s=>{let v=uni.filter(x=>x.stage===s);let semesters=[...new Set(v.map(x=>x.semester))].sort((a,b)=>a-b);return `<section class="panel"><h3>Stage ${s} <span class="muted">· ${v.length} stage/semester module entries</span></h3><div class="semester-grid">${semesters.map(sem=>{let items=v.filter(x=>x.semester===sem);return `<div class="semester"><h3>Semester ${sem} <span class="muted">· ${items.length} modules</span></h3><div class="table-wrap"><table class="list-table"><thead><tr><th>Code</th><th>Module</th><th class="right">Courses</th></tr></thead><tbody>${items.map(r=>`<tr><td><span class="code">${esc(r.code)}</span></td><td>${esc(r.title)}</td><td class="right">${r.courses.size}</td></tr>`).join('')}</tbody></table></div></div>`}).join('')}</div></section>`}).join('')||'<section class="panel empty">No matching modules.</section>';return}
let activeStages=stage==='all'?avail:[Number(stage)];$('content').innerHTML=activeStages.map(s=>`<section><div class="summary"><h2>Stage ${s}</h2></div><div class="semester-grid">${[1,2,3].filter(sem=>selectedGroups().some(g=>g.rows.some(r=>r.stage===s&&r.semester===sem))).map(sem=>{let cells=selectedGroups().map(g=>({g,rows:g.rows.filter(r=>r.stage===s&&r.semester===sem&&(!search||(r.code+' '+r.title).toLowerCase().includes(search)))})).filter(x=>x.rows.length);return `<div class="semester"><h3>Semester ${sem}</h3>${cells.length?cells.map(({g,rows})=>`<article class="group"><div class="grouphead"><strong>Elective Group ${g.group}</strong><span class="pill">${rows.length} options</span></div>${rows.map(r=>`<div class="module"><span class="code">${esc(r.code)}</span><span class="module-name">${esc(r.title)}</span></div>`).join('')}</article>`).join(''):'<div class="empty">No matching modules</div>'}</div>`}).join('')}</div></section>`).join('')||'<section class="panel empty">No matching modules.</section>'}
render();</script></body></html>
